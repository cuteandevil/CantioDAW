[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cantiodaw"
version = "0.1.0"
description = "AI-Powered Singing Voice Production DAW"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "Flask>=2.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
audio = ["sounddevice>=0.4", "librosa>=0.9"]
midi = ["mido>=1.3"]
training = ["scipy>=1.7"]
synthesis = ["pyworld>=0.3"]
all = ["PyQt6>=6.5", "sounddevice>=0.4", "librosa>=0.9", "mido>=1.3", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/cuteandevil/CantioDAW"
Documentation = "https://github.com/cuteandevil/CantioDAW"

[project.scripts]
cantiodaw = "cantiodaw.__main__:main"

[tool.setuptools.packages.find]
include = ["cantiodaw*"]
